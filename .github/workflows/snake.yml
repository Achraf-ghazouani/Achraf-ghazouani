name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23534AB7&color_dots=%230D1117,%2324135F,%23534AB7,%2300B8D9,%2300E5A8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2300E5A8&color_dots=%230D1117,%2324135F,%23534AB7,%2300B8D9,%2300E5A8

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
